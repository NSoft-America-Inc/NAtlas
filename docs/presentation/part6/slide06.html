<section style="justify-content: center; align-items: center; text-align: center">
  <div class="slide-counter">SLIDE 06 / 06</div>
  <div class="slide-subtitle">전사 도입 성과 및 미래 비전 로드맵</div>

  <div
    class="glass-panel"
    style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: none;
      background: transparent;
      box-shadow: none;
      transform: scale(1.1);
      animation: scale-pulse 5s infinite;
    "
  >
    <div
      style="
        width: 220px;
        height: 160px;
        margin-bottom: 15px;
        position: relative;
        transform: scale(1.35);
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <svg viewBox="0 0 200 150" width="200" height="150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="neon-glow-finale" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#030408" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- Spiraling "Thank You" Galaxy particles -->
        <g style="transform-origin: 100px 75px; animation: rotate-slow 15s linear infinite">
          <circle
            cx="100"
            cy="75"
            r="50"
            fill="none"
            stroke="rgba(168,85,247,0.15)"
            stroke-width="1"
            stroke-dasharray="4 8"
          />
          <circle
            cx="100"
            cy="75"
            r="35"
            fill="none"
            stroke="rgba(168,85,247,0.2)"
            stroke-width="1.2"
            stroke-dasharray="2 4"
          />
          <circle cx="60" cy="50" r="3" fill="#a855f7" filter="url(#neon-glow-finale)" />
          <circle cx="140" cy="100" r="3" fill="#c084fc" filter="url(#neon-glow-finale)" />
          <circle cx="130" cy="45" r="2.5" fill="#f43f5e" filter="url(#neon-glow-finale)" />
          <circle cx="70" cy="105" r="2.5" fill="#10b981" filter="url(#neon-glow-finale)" />
        </g>

        <!-- Vertical projecting light beams (NSoft 공전 빔 피날레) -->
        <polygon
          points="90,150 100,75 110,150"
          fill="url(#beam-grad)"
          style="mix-blend-mode: screen"
        />
        <polygon points="95,0 100,75 105,0" fill="url(#beam-grad)" style="mix-blend-mode: screen" />

        <!-- Central NSoft Core Orb -->
        <g style="animation: scale-pulse 4s infinite; transform-origin: 100px 75px">
          <circle
            cx="100"
            cy="75"
            r="18"
            fill="rgba(8,12,22,0.95)"
            stroke="var(--accent-purple)"
            stroke-width="2.5"
            filter="url(#neon-glow-finale)"
          />
          <text
            x="100"
            y="80"
            fill="#ffffff"
            font-family="'Outfit', sans-serif"
            font-size="14"
            font-weight="900"
            letter-spacing="0.05em"
            text-anchor="middle"
            filter="url(#neon-glow-finale)"
          >
            N
          </text>
        </g>
      </svg>
    </div>

    <h2
      style="
        font-size: 2.3vw !important;
        margin: 0;
        color: #ffffff !important;
        font-weight: bold;
        line-height: 1.35 !important;
      "
    >
      지식은 NStack과 NAtlas가 컴파일합니다.<br />
      <strong
        style="color: var(--accent-purple); filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.5))"
        >코딩만 하십시오.</strong
      >
    </h2>

    <p
      style="
        font-size: 1vw !important;
        max-width: 600px;
        color: var(--text-muted) !important;
        line-height: 1.8;
        margin-top: 25px;
      "
    >
      기술 부채와 히스토리 휘발의 어두운 시대를 끝내고,<br />
      영구적이고 안전한 전사 지식 자산 플랫폼으로 도약합니다.
    </p>

    <div
      style="
        font-family: 'Outfit', sans-serif;
        font-size: 0.8vw;
        color: rgba(255, 255, 255, 0.2);
        display: flex;
        gap: 15px;
        margin-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        padding-top: 20px;
      "
    >
      <span>NSoft America, Inc.</span>
      <span>|</span>
      <span>E2E Knowledge Pipeline</span>
    </div>
  </div>

  <div class="slide-master-footer" style="position: absolute; bottom: 0; width: 90%">
    <span>NStack ➔ NAtlas E2E 지식 파이프라인 피날레</span>
    <span>NSoft America, Inc.</span>
  </div>
</section>
