name: Release NAtlas & NStack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Application
    runs-on: macos-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Best GitHub Token
        id: resolve_token
        run: |
          TOKEN=$(python3 rotate_tokens.py)
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "RESOLVED_TOKEN=$TOKEN" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN_1: ${{ secrets.GH_TOKEN_1 }}
          GH_TOKEN_2: ${{ secrets.GH_TOKEN_2 }}
          GH_TOKEN_3: ${{ secrets.GH_TOKEN_3 }}
          GH_TOKEN_4: ${{ secrets.GH_TOKEN_4 }}
          GH_TOKEN_5: ${{ secrets.GH_TOKEN_5 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Embedded Portable Runtimes
        run: python3 prepare_embedded_runtimes.py

      - name: Dereference pnpm symlinks for bundled packages (macOS)
        run: |
          # Dereference @swarmvaultai symlinks (pnpm -> .pnpm store) to real files
          cp -rL node_modules/@swarmvaultai ./swarmvaultai_real
          rm -rf node_modules/@swarmvaultai
          mv ./swarmvaultai_real node_modules/@swarmvaultai

          # Ensure commander is findable by @swarmvaultai/cli at runtime
          if [ -d "node_modules/commander" ]; then
            echo "commander found at top-level, dereferencing..."
            cp -rL node_modules/commander ./commander_real
            rm -rf node_modules/commander
            mv ./commander_real node_modules/commander
          else
            echo "commander not at top-level (pnpm strict). Searching .pnpm store..."
            COMMANDER_STORE=$(find node_modules/.pnpm -path "*/node_modules/commander" -type d 2>/dev/null | head -1)
            if [ -n "$COMMANDER_STORE" ]; then
              echo "Found commander at: $COMMANDER_STORE"
              mkdir -p node_modules/@swarmvaultai/cli/node_modules
              cp -rL "$COMMANDER_STORE" node_modules/@swarmvaultai/cli/node_modules/commander
              echo "Installed commander into @swarmvaultai/cli/node_modules/"
            else
              echo "Warning: commander not found in pnpm store!"
            fi
          fi

      - name: Build macOS Assets
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ steps.resolve_token.outputs.RESOLVED_TOKEN }}
          DEBUG: electron-builder

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natlas-mac
          path: dist/natlas-*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows Application
    runs-on: windows-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Best GitHub Token
        id: resolve_token
        shell: bash
        run: |
          TOKEN=$(python rotate_tokens.py)
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "RESOLVED_TOKEN=$TOKEN" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN_1: ${{ secrets.GH_TOKEN_1 }}
          GH_TOKEN_2: ${{ secrets.GH_TOKEN_2 }}
          GH_TOKEN_3: ${{ secrets.GH_TOKEN_3 }}
          GH_TOKEN_4: ${{ secrets.GH_TOKEN_4 }}
          GH_TOKEN_5: ${{ secrets.GH_TOKEN_5 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Embedded Portable Runtimes
        run: python prepare_embedded_runtimes.py

      - name: Dereference pnpm symlinks for bundled packages (Windows)
        shell: pwsh
        run: |
          # Dereference @swarmvaultai symlinks to real files
          New-Item -ItemType Directory -Force -Path swarmvaultai_real | Out-Null
          Get-ChildItem -Path node_modules/@swarmvaultai | ForEach-Object {
            $dest = "swarmvaultai_real/$($_.Name)"
            if ($_.Attributes -match "ReparsePoint") {
              $resolved = [System.IO.Directory]::ResolveLinkTarget($_.FullName, $true)
              Copy-Item -Path $resolved.FullName -Destination $dest -Recurse -Force
            } else {
              Copy-Item -Path $_.FullName -Destination $dest -Recurse -Force
            }
          }
          Remove-Item -Recurse -Force node_modules/@swarmvaultai
          Move-Item swarmvaultai_real node_modules/@swarmvaultai

          # Ensure commander is available to @swarmvaultai/cli
          if (Test-Path node_modules/commander) {
            Write-Host "commander found at top-level, dereferencing..."
            $cmdItem = Get-Item node_modules/commander
            if ($cmdItem.Attributes -match "ReparsePoint") {
              $resolved = [System.IO.Directory]::ResolveLinkTarget($cmdItem.FullName, $true)
              Copy-Item -Path $resolved.FullName -Destination commander_real -Recurse -Force
            } else {
              Copy-Item -Path node_modules/commander -Destination commander_real -Recurse -Force
            }
            Remove-Item -Recurse -Force node_modules/commander
            Move-Item commander_real node_modules/commander
          } else {
            Write-Host "commander not at top-level. Searching .pnpm store..."
            $store = Get-ChildItem -Path node_modules/.pnpm -Recurse -Filter commander -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($store) {
              Write-Host "Found commander at: $($store.FullName)"
              $cliNodeModules = "node_modules/@swarmvaultai/cli/node_modules"
              New-Item -ItemType Directory -Force -Path $cliNodeModules | Out-Null
              Copy-Item -Path $store.FullName -Destination "$cliNodeModules/commander" -Recurse -Force
              Write-Host "Installed commander into @swarmvaultai/cli/node_modules/"
            } else {
              Write-Host "Warning: commander not found!"
            }
          }

      - name: Build Windows Assets
        run: npm run build:win
        env:
          GH_TOKEN: ${{ steps.resolve_token.outputs.RESOLVED_TOKEN }}
          DEBUG: electron-builder

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natlas-win
          path: dist/natlas-*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: natlas-mac
          path: release-artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: natlas-win
          path: release-artifacts

      - name: Create and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/natlas-*.dmg
            release-artifacts/natlas-*-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
