name: Release NAtlas & NStack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Best GitHub Token
        id: resolve_token
        run: |
          TOKEN=$(python3 rotate_tokens.py)
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "RESOLVED_TOKEN=$TOKEN" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN_1: ${{ secrets.GH_TOKEN_1 }}
          GH_TOKEN_2: ${{ secrets.GH_TOKEN_2 }}
          GH_TOKEN_3: ${{ secrets.GH_TOKEN_3 }}
          GH_TOKEN_4: ${{ secrets.GH_TOKEN_4 }}
          GH_TOKEN_5: ${{ secrets.GH_TOKEN_5 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Embedded Portable Runtimes
        run: python3 prepare_embedded_runtimes.py

      - name: Build macOS Assets
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ steps.resolve_token.outputs.RESOLVED_TOKEN }}

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natlas-mac
          path: dist/natlas-*.dmg
          if-no-files-found: error

  build-win:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Best GitHub Token
        id: resolve_token
        shell: bash
        run: |
          TOKEN=$(python rotate_tokens.py)
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "RESOLVED_TOKEN=$TOKEN" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN_1: ${{ secrets.GH_TOKEN_1 }}
          GH_TOKEN_2: ${{ secrets.GH_TOKEN_2 }}
          GH_TOKEN_3: ${{ secrets.GH_TOKEN_3 }}
          GH_TOKEN_4: ${{ secrets.GH_TOKEN_4 }}
          GH_TOKEN_5: ${{ secrets.GH_TOKEN_5 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Embedded Portable Runtimes
        run: python prepare_embedded_runtimes.py

      - name: Build Windows Assets
        run: npm run build:win
        env:
          GH_TOKEN: ${{ steps.resolve_token.outputs.RESOLVED_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natlas-win
          path: dist/natlas-*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: natlas-mac
          path: release-artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: natlas-win
          path: release-artifacts

      - name: Create and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/natlas-*.dmg
            release-artifacts/natlas-*-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
